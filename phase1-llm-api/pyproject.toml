[project]
name = "phase1-llm-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx[socks]>=0.28.1",
    "openai>=2.50.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
# 让"函数没写返回注解"直接变成错误——否则 mypy 默认跳过无注解函数的函数体（免检区），
# 会给出虚假的 Success。本人已在此栽过四次（阶段0测试丢 2 分即因于此）。
disallow_untyped_defs = true
